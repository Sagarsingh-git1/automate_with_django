    {% extends 'base.html' %}
    {% block content %}

    <div class="container mt-5 alert-primary shadow" style="max-width:600px;padding:50px;border-radius:10px;">
        <h3 class="text-center">Import Data to Database Tables</h3>
        <form action="{% url 'import_data' %}" method="GET">
            <div class="form-group">
                <label for="model_name">Select the Database Table</label>

                <select name="model_name" onchange="this.form.submit()" class="form-control" required>
                    <option value="" disabled selected>Select</option>
                    {% for model in models %}
                    <option value="{{model.label}}" {% if model.label == selected_model %}selected {% endif %} >{{model.name}}</option>
                    {% endfor %}
                </select>
                

                {% if fields %}
                <h4>Fields:</h4>
                <ul>
                    {% for field in fields %}
                    <li>
                        {{ field }}
                     </li>
                     {% endfor %}
                </ul>

                {% endif %}
                
            </div>
            </form>
        <form action="{% url 'import_data' %}" method="POST" enctype="multipart/form-data" style="max-width: 600px;margin: auto;padding-top: 50px;">
            {% csrf_token %}
            <div class="form-group">
                <label for="file_path">Upload CSV file</label>
                <input type="file" name="file_path" class="form-control" required>
            </div>
            <input type="hidden" name="model_name" value="{{selected_model}}">
            
            <div class="form-group">
            <input type="submit" value="Import data" class="btn btn-primary">
            </div>
            {% include 'alerts.html' %}
        </form>
        
    </div>

{% endblock %}
